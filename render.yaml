services:
  - type: web
    name: etymograph
    runtime: python
    buildCommand: bash build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: NODE_VERSION
        value: "20"
      - key: HF_TOKEN
        sync: false
      - key: ETYMOGRAPH_DB
        value: "../../data/etymograph.db"
    disk:
      name: etymograph-data
      mountPath: /opt/render/project/src/data
      sizeGB: 10
